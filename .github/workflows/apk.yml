name: Build Android APK (sbvpn core)

# Builds the official sing-box-for-android client with our patched sbvpn core
# (hyy807/sbvpn = official testing + LightXtreme private protocol patch).
# The .aar is built from sbvpn source via gomobile, then Gradle assembles the APK.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: sbvpn core + official client → unsigned APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Android client
        uses: actions/checkout@v4

      - name: Check out sbvpn core (sibling directory)
        uses: actions/checkout@v4
        with:
          repository: hyy807/sbvpn
          path: ../sing-box
          submodules: recursive

      - name: Show revisions
        run: |
          echo "client: $(git log --oneline -1)"
          echo "core: $(git -C ../sing-box log --oneline -1)"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ../sing-box/go.mod
          cache: false

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            ndk;28.0.13004108

      - name: Install gomobile
        working-directory: ../sing-box
        run: |
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"

      - name: Build libbox.aar (from sbvpn core)
        working-directory: ../sing-box
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android
          ls -lh libbox.aar

      - name: Place libbox.aar in client
        run: |
          mkdir -p app/libs
          cp ../sing-box/libbox.aar app/libs/libbox.aar
          # legacy variant uses the same aar
          cp ../sing-box/libbox.aar app/libs/libbox-legacy.aar
          ls -lh app/libs/

      - name: Build APK (other release flavor — no Google Play)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.0.13004108"
          chmod +x gradlew
          ./gradlew :app:clean :app:assembleOtherRelease --no-daemon

      - name: Verify APK
        run: |
          find app/build/outputs -name "*.apk" -exec ls -lh {} \;
          APK=$(find app/build/outputs -name "*.apk" | head -1)
          test -n "$APK" || { echo "No APK produced"; exit 1; }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          cp app/build/outputs/apk/other/release/*.apk output/
          ls -lh output/
          gh release create "apk-${GITHUB_RUN_ID}" output/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "sing-box Android APK (run ${GITHUB_RUN_ID})" \
            --notes "Unsigned Android APK from official sing-box-for-android + sbvpn patched core (LightXtreme private protocol)."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-android-apk
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30
